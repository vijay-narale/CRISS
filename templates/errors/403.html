{% extends "base.html" %}

{% block title %}403 Forbidden{% endblock %}

{% block content %}
<div class="container text-center py-5 my-5">
    <div class="display-1 text-danger fw-bold mb-3">403</div>
    <h3 class="fw-bold text-navy-800 mb-2">Access Denied / Forbidden</h3>
    <p class="text-secondary mb-4">
        You do not have the required administrative permissions to access this campus resource.
    </p>
    <a href="{{ url_for('catalog.index') }}" class="btn btn-teal">
        <i class="bi bi-house me-1"></i> Return to Home
    </a>
</div>
{% endblock %}
