{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card card-criss shadow-sm p-4">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-teal-50 text-teal-600 mb-2">
                        <i class="bi bi-shield-lock-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-navy-800">Sign In to CRISS</h3>
                    <p class="text-muted small">Campus Resource Intelligence & Sharing System</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                    <div class="mb-3">
                        <label for="login-email" class="form-label fw-semibold">Campus Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="login-email" name="email" value="{{ email or '' }}" required autofocus placeholder="name@criss.edu">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="login-password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="login-password" name="password" required placeholder="Enter password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-teal w-100 py-2 fw-bold mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Authenticate & Continue
                    </button>
                </form>

                <!-- Demo Credentials Quick-Fill for Evaluation -->
                <div class="p-3 bg-light rounded border mt-2">
                    <div class="small fw-bold text-secondary mb-2 text-uppercase">
                        <i class="bi bi-stars text-warning me-1"></i> Quick Demo Accounts (Click to Fill):
                    </div>
                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-sm btn-outline-dark text-start" onclick="fillLogin('admin@criss.edu', 'AdminPassword@123')">
                            <span class="badge bg-danger me-1">Admin</span> Dr. Eleanor Vance (admin@criss.edu)
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-dark text-start" onclick="fillLogin('faculty@criss.edu', 'FacultyPassword@123')">
                            <span class="badge bg-primary me-1">Faculty</span> Prof. Rajesh Kulkarni (faculty@criss.edu)
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-dark text-start" onclick="fillLogin('student@criss.edu', 'StudentPassword@123')">
                            <span class="badge bg-success me-1">Student</span> Aarav Sharma (student@criss.edu)
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-dark text-start" onclick="fillLogin('lender@criss.edu', 'StudentPassword@123')">
                            <span class="badge bg-purple text-dark border me-1">Peer Lender</span> Priya Patel (lender@criss.edu)
                        </button>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <span class="text-muted small">New student or faculty member? </span>
                    <a href="{{ url_for('auth.register') }}" class="small fw-semibold text-teal-600">Create an Account</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
